<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEC Admin Block Map & Navigation</title>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
:root {
    --navy: #12345b;
    --blue: #1769aa;
    --green: #159b72;
    --bg: #f3f7fb;
    --ink: #1e293b;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
}

header {
    background: linear-gradient(120deg, #102b4e, #247bc1);
    color: white;
    text-align: center;
    padding: 22px 14px;
}

header h1 {
    margin: 0;
    font-size: clamp(22px, 4vw, 32px);
}

header p { margin: 8px 0 0; }

nav {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    background: white;
    padding: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

button {
    border: 0;
    border-radius: 9px;
    padding: 11px 15px;
    font-weight: 700;
    cursor: pointer;
    background: #e5edf6;
    color: var(--navy);
}

button:hover { filter: brightness(0.97); }

button.primary, nav button.active {
    background: var(--blue);
    color: white;
}

main {
    max-width: 1000px;
    margin: 22px auto;
    padding: 0 14px;
}

.panel {
    background: white;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 5px 20px rgba(16,43,78,0.05);
}

h2 {
    margin-top: 0;
    color: var(--navy);
}

.searchrow {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 10px;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #cbd5e1;
    border-radius: 9px;
    font-size: 17px;
}

/* Ensure Leaflet container has fixed height */
#map {
    height: 450px;
    width: 100%;
    border-radius: 12px;
    border: 1px solid #cbd5e1;
    margin-top: 15px;
    z-index: 1;
}

.floor-tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 12px;
}

.floor-tabs button {
    flex: 1;
    min-width: 130px;
}

.floor-tabs button.active {
    background: #159b72;
    color: white;
}

#roomList {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
    gap: 8px;
    margin-top: 10px;
}

.roomchip {
    background: #f8fafc;
    border: 1px solid #d8e2ed;
    border-radius: 8px;
    padding: 10px;
    text-align: center;
    cursor: pointer;
    font-weight: bold;
}

.roomchip:hover { background: #e2e8f0; }

.roomchip span {
    display: block;
    font-size: 12px;
    font-weight: normal;
    color: #64748b;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
    margin-top: 16px;
}

.stat {
    background: #eff6ff;
    border-radius: 11px;
    padding: 13px;
}

.stat b {
    display: block;
    color: #247bc1;
    font-size: 13px;
    margin-bottom: 7px;
}

#message {
    font-weight: 700;
    margin-top: 12px;
    color: var(--navy);
}

footer {
    text-align: center;
    color: #64748b;
    padding: 20px;
}

@media(max-width: 600px) {
    .searchrow { grid-template-columns: 1fr; }
    .stats { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header>
  <h1>KEC Admin Block Map & Navigation</h1>
  <p>Interactive Campus & Indoor Navigation System</p>
</header>

<main>
  <div class="panel">
    <h2>Search & Navigation</h2>
    <div class="searchrow">
      <input type="text" id="searchInput" placeholder="Enter Room Number or Office (e.g. Principal, A101)...">
      <button class="primary" id="btnSearch">Search Location</button>
    </div>
    <div id="message"></div>

    <div class="stats">
      <div class="stat"><b>Target Location</b><span id="targetStat">Not Selected</span></div>
      <div class="stat"><b>Floor Level</b><span id="floorStat">GROUND</span></div>
      <div class="stat"><b>GPS Status</b><span id="gpsStat">Locating...</span></div>
    </div>
  </div>

  <div class="panel">
    <h2>Floor Plan & Interactive Map</h2>
    <div class="floor-tabs" id="floorTabs">
      <button class="active" data-floor="ground">Ground Floor</button>
      <button data-floor="first">First Floor</button>
      <button data-floor="second">Second Floor</button>
    </div>

    <!-- Leaflet Map Container -->
    <div id="map"></div>

    <h3 style="margin-top: 20px;">Quick Room Selection</h3>
    <div id="roomList"></div>
  </div>
</main>

<footer>
  <p>&copy; Kongu Engineering College - Campus Navigation System</p>
</footer>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
    // Base coordinates for KEC Admin Block
    const adminCoords = [11.2739, 77.6071];

    // Room Database
    const rooms = [
        { id: "A101", name: "Principal Office", floor: "ground", lat: 11.27395, lng: 77.60705 },
        { id: "A102", name: "Administrative Office", floor: "ground", lat: 11.27385, lng: 77.60715 },
        { id: "A103", name: "Conference Hall", floor: "ground", lat: 11.27400, lng: 77.60720 },
        { id: "A201", name: "Dean Office", floor: "first", lat: 11.27395, lng: 77.60705 },
        { id: "A202", name: "CAD Lab", floor: "first", lat: 11.27385, lng: 77.60715 },
        { id: "A301", name: "Board Room", floor: "second", lat: 11.27395, lng: 77.60705 },
        { id: "A302", name: "Server Room", floor: "second", lat: 11.27385, lng: 77.60715 }
    ];

    let currentFloor = 'ground';
    let markersLayer = L.layerGroup();
    let userMarker = null;

    // 1. Initialize Map
    const map = L.map('map').setView(adminCoords, 18);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    markersLayer.addTo(map);

    // 2. Render Functions
    function renderRooms() {
        const list = document.getElementById('roomList');
        list.innerHTML = '';
        rooms.filter(r => r.floor === currentFloor).forEach(room => {
            const chip = document.createElement('div');
            chip.className = 'roomchip';
            chip.innerHTML = `${room.id} <span>${room.name}</span>`;
            chip.addEventListener('click', () => selectRoom(room));
            list.appendChild(chip);
        });
    }

    function displayFloorMarkers() {
        markersLayer.clearLayers();
        rooms.filter(r => r.floor === currentFloor).forEach(room => {
            const marker = L.marker([room.lat, room.lng])
                .bindPopup(`<b>${room.id}</b><br>${room.name}<br>Floor: ${room.floor.toUpperCase()}`);
            markersLayer.addLayer(marker);
        });
    }

    function switchFloor(floorName) {
        currentFloor = floorName;
        
        // Update Tab UI
        const buttons = document.querySelectorAll('#floorTabs button');
        buttons.forEach(btn => {
            btn.classList.toggle('active', btn.getAttribute('data-floor') === floorName);
        });

        renderRooms();
        displayFloorMarkers();
        document.getElementById('floorStat').innerText = floorName.toUpperCase();
    }

    function selectRoom(room) {
        map.setView([room.lat, room.lng], 19);
        L.popup()
            .setLatLng([room.lat, room.lng])
            .setContent(`<b>${room.id}: ${room.name}</b>`)
            .openOn(map);

        document.getElementById('targetStat').innerText = `${room.id} (${room.name})`;
        document.getElementById('floorStat').innerText = room.floor.toUpperCase();
        document.getElementById('message').innerText = `Navigating to ${room.name}...`;
    }

    function searchRoom() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        if (!query) return;

        const found = rooms.find(r => r.id.toLowerCase().includes(query) || r.name.toLowerCase().includes(query));

        if (found) {
            if (found.floor !== currentFloor) {
                switchFloor(found.floor);
            }
            selectRoom(found);
        } else {
            document.getElementById('message').innerText = "Location not found in database.";
        }
    }

    // 3. User Geolocation
    function locateUser() {
        map.locate({ setView: false, watch: true, enableHighAccuracy: true });

        map.on('locationfound', function(e) {
            document.getElementById('gpsStat').innerText = "Active";
            if (!userMarker) {
                userMarker = L.marker(e.latlng).addTo(map).bindPopup("<b>Your Location</b>");
            } else {
                userMarker.setLatLng(e.latlng);
            }
        });

        map.on('locationerror', function() {
            document.getElementById('gpsStat').innerText = "Disabled/Unavailable";
        });
    }

    // 4. Attach Event Listeners
    document.getElementById('btnSearch').addEventListener('click', searchRoom);
    document.getElementById('searchInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') searchRoom();
    });

    document.querySelectorAll('#floorTabs button').forEach(btn => {
        btn.addEventListener('click', function () {
            switchFloor(this.getAttribute('data-floor'));
        });
    });

    // 5. Initial Execution & Fix map rendering sizing
    renderRooms();
    displayFloorMarkers();
    locateUser();

    setTimeout(() => {
        map.invalidateSize();
    }, 200);
});
</script>
</body>
</html>
